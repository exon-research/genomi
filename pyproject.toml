[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "genomi"
version = "0.1.0"
description = "Agent-facing genomics runtime for private genome source analysis and evidence-grounded DNA research."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Exon Research" }
]
dependencies = [
  "biopython>=1.87",
  # GenomiLab persists its in-memory SQLite state as an authenticated encrypted
  # container and stores the encryption key in an OS-backed secret store.
  "cryptography>=42",
  "google-genai>=2.0.1",
  # Typed Paperclip client for a fixed public connection probe and separately
  # authorized investigation-scoped evidence operations.
  "gxl-paperclip @ git+https://github.com/GXL-ai/paperclip.git@b5571365f0b36847dce42c5d66d2b158a0f871f9",
  "keyring>=25",
  # Proto prerequisite checks use an isolated, fixed-endpoint child with
  # explicit user-owned Modal credentials; no Proto tool is deployed or run.
  "modal==1.5.1",
  "numpy>=1.26",
  "openpyxl>=3.1.5",
  # htslib bindings: parse_source writes a bgzip-compressed canonical VCF
  # per Active Genome Index and downstream capabilities read it via
  # BGZFile virtual-offset random access. Never reopen the user's intake.
  "pysam>=0.22",
  # GRCh37 <-> GRCh38 coordinate liftover via UCSC chain files. Pure-Python,
  # consumed by genomi.runtime.liftover and any capability that has to align
  # personal-genome and public-resource coordinates across builds.
  "pyliftover>=0.4",
  # Intel ISA-L gzip acceleration — 3-5x faster decompression for ClinVar/
  # population VCF imports vs stdlib gzip. Falls back to subprocess gzip or
  # stdlib gzip when unavailable.
  "isal>=1.1",
  "duckdb>=1.0",
]

[project.urls]
Homepage = "https://www.genomiagent.com/"
Repository = "https://github.com/exon-research/genomi.git"

[project.scripts]
genomi = "genomi.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"genomi" = ["assets/*.png"]
"genomi.operations" = ["catalog_base.json"]
"genomi.runtime" = ["tool_catalog.json", "host_response_profiles.json"]
"genomi.active_genome_index" = ["tool_catalog.json", "panels/*.json"]
"genomi.capabilities.analytical_grounding" = ["tool_catalog.json"]
"genomi.capabilities.ancestry" = ["tool_catalog.json"]
"genomi.capabilities.clinvar" = ["tool_catalog.json"]
"genomi.capabilities.decode" = ["tool_catalog.json", "templates/*.html", "templates/vendor/*.js"]
"genomi.capabilities.functional_genomics" = ["tool_catalog.json"]
"genomi.capabilities.gnomad" = ["tool_catalog.json"]
"genomi.capabilities.gwas" = ["tool_catalog.json"]
"genomi.capabilities.journal" = ["tool_catalog.json"]
"genomi.capabilities.nutrigenomics" = ["tool_catalog.json"]
"genomi.capabilities.pharmacogenomics" = ["tool_catalog.json", "data/*.json"]
"genomi.capabilities.phenotype" = ["tool_catalog.json"]
"genomi.capabilities.prs" = ["tool_catalog.json"]
"genomi.capabilities.research" = ["tool_catalog.json"]
"genomi.capabilities.sequence" = ["tool_catalog.json"]
"genomi.capabilities.variant" = ["tool_catalog.json"]
"genomi.lab" = ["tool_catalog.json", "static/*.html", "static/*.css", "static/*.js"]

# Keep the canonical agent guidance outside the Python package in the source
# tree, while installing the same layout under <environment>/share/genomi for
# package-managed runtimes. Runtime discovery and host-skill linking resolve
# either layout through genomi.runtime.skill_assets.
[tool.setuptools.data-files]
"share/genomi" = ["SKILL.md"]
"share/genomi/skills" = ["skills/_output-rules.md"]
"share/genomi/skills/active-genome-index" = ["skills/active-genome-index/SKILL.md"]
"share/genomi/skills/analytical-grounding" = ["skills/analytical-grounding/SKILL.md"]
"share/genomi/skills/ancestry" = ["skills/ancestry/SKILL.md"]
"share/genomi/skills/clinvar" = ["skills/clinvar/SKILL.md"]
"share/genomi/skills/conventions" = ["skills/conventions/context-routing.md", "skills/conventions/evidence-quality.md"]
"share/genomi/skills/decode" = ["skills/decode/SKILL.md"]
"share/genomi/skills/drug-targets" = ["skills/drug-targets/SKILL.md"]
"share/genomi/skills/functional-genomics" = ["skills/functional-genomics/SKILL.md"]
"share/genomi/skills/genomic-inquiry" = ["skills/genomic-inquiry/SKILL.md"]
"share/genomi/skills/genomilab" = ["skills/genomilab/SKILL.md"]
"share/genomi/skills/genomilab/agents" = ["skills/genomilab/agents/openai.yaml"]
"share/genomi/skills/gnomad" = ["skills/gnomad/SKILL.md"]
"share/genomi/skills/gwas-catalog" = ["skills/gwas-catalog/SKILL.md"]
"share/genomi/skills/journal" = ["skills/journal/SKILL.md"]
"share/genomi/skills/nutrigenomics" = ["skills/nutrigenomics/SKILL.md"]
"share/genomi/skills/pharmacogenomics" = ["skills/pharmacogenomics/SKILL.md"]
"share/genomi/skills/prs" = ["skills/prs/SKILL.md"]
"share/genomi/skills/rare-disease-cancer" = ["skills/rare-disease-cancer/SKILL.md"]
"share/genomi/skills/sequence" = ["skills/sequence/SKILL.md"]
"share/genomi/skills/source-research" = ["skills/source-research/SKILL.md"]
"share/genomi/skills/variant-evidence" = ["skills/variant-evidence/SKILL.md"]

[tool.ruff]
required-version = "==0.16.2"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
