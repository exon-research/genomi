<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genomi Permission Approval Card Fixture</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050706;
        --panel: #101413;
        --line: #26302d;
        --line-strong: #0f6b52;
        --ink: #f4f7f5;
        --muted: #9ea7a2;
        --accent: #17c694;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(140deg, rgba(23, 198, 148, 0.08), transparent 36%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(760px, calc(100vw - 40px));
        display: grid;
        gap: 18px;
      }
      .workspace-label {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .message {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(16, 20, 19, 0.94);
        overflow: hidden;
      }
      .message-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px;
      }
      .message-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .work-chip {
        display: grid;
        gap: 10px;
        margin: 18px;
        padding: 14px;
        border: 1px solid rgba(245, 158, 11, 0.5);
        border-radius: 9px;
        background: rgba(245, 158, 11, 0.08);
      }
      .work-chip-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--warning);
      }
      .work-chip-title {
        font-size: 14px;
        font-weight: 750;
      }
      .work-chip-summary {
        color: var(--muted);
        font-size: 13px;
      }
      .permission-request {
        display: grid;
        gap: 6px;
        border: 1px solid rgba(23, 198, 148, 0.35);
        border-radius: 8px;
        background: rgba(23, 198, 148, 0.08);
        padding: 12px;
      }
      .permission-request strong {
        color: var(--ink);
        font-size: 13px;
      }
      .permission-request p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151a18;
        color: var(--ink);
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
      }
      .primary {
        border-color: var(--line-strong);
        background: var(--accent);
        color: #03100c;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="workspace-label">Genomi Portal / blocked assistant turn</div>
      <section class="message" aria-label="Assistant work">
        <div class="message-header">
          <h1 class="message-title">Ask Genomi</h1>
          <span class="work-chip-summary">1 error</span>
        </div>
        <div class="work-chip">
          <div class="work-chip-header">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="work-chip-title">Permission needed</span>
            <span class="work-chip-summary">Read current Genomi context</span>
          </div>
          <div class="permission-request">
            <strong>Read current Genomi context</strong>
            <p>The local assistant needs this access to continue the same request. Approve it here to retry this turn from the portal.</p>
          </div>
          <div class="actions">
            <button class="primary" type="button">Approve access and retry</button>
            <button type="button">Deny</button>
            <button type="button">Copy technical details</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
